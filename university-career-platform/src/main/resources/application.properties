spring.application.name=university-career-platform

server.port=8080
server.address=0.0.0.0

# MySQL
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/jishe?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai}
spring.datasource.username=${DB_USERNAME:jishe}
spring.datasource.password=${DB_PASSWORD}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# JWT
jwt.secret=${JWT_SECRET}
jwt.expiration=86400000

# AI API
ai.aliyun.api-key=${ALIYUN_API_KEY}
ai.aliyun.api-url=https://dashscope.aliyuncs.com/compatible-mode/v1/chat/completions
ai.model.counseling=qwen2.5-7b-instruct_5fd34c80
ai.model.resume=deepseek-v3
ai.model.resume-draft=deepseek-r1
ai.mentor.model-id=qwen2.5-7b-instruct-3eb6d099b67a
ai.mentor.system-prompt=\u4F60\u662F\u4E00\u4F4D\u4E13\u4E1A\u7684\u5927\u5B66\u751F\u5B66\u4E1A\u89C4\u5212\u4E0E\u804C\u4E1A\u53D1\u5C55\u5BFC\u5E08\uFF0C\u540D\u4E3A\u201C\u660E\u7406\u201D\u3002\u4F60\u7684\u4EFB\u52A1\u662F\u4E3A\u5B66\u751F\u63D0\u4F9B\u5B66\u4E1A\u6307\u5BFC\u3001\u7ADE\u8D5B\u5EFA\u8BAE\u3001\u5FC3\u7406\u652F\u6301\u548C\u804C\u4E1A\u53D1\u5C55\u65B9\u6848\u3002\u8BF7\u59CB\u7EC8\u4FDD\u6301\u8010\u5FC3\u3001\u4E13\u4E1A\u4E14\u5BCC\u6709\u542F\u53D1\u6027\uFF0C\u652F\u6301 Markdown \u683C\u5F0F\u56DE\u590D

# OSS
aliyun.oss.endpoint=${ALIYUN_OSS_ENDPOINT:oss-cn-hangzhou.aliyuncs.com}
aliyun.oss.accessKeyId=${ALIYUN_OSS_ACCESS_KEY_ID}
aliyun.oss.accessKeySecret=${ALIYUN_OSS_ACCESS_KEY_SECRET}
aliyun.oss.bucketName=${ALIYUN_OSS_BUCKET_NAME:zhiyuexueye}

# Redis
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}

# Dynamic AI engine: aliyunLlmStrategy or baiduLlmStrategy
ai.engine.active=aliyunLlmStrategy

# Kafka
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.retries=3
spring.kafka.consumer.group-id=im-persist-group
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=*
spring.kafka.consumer.enable-auto-commit=true

# Elasticsearch
spring.elasticsearch.uris=${ELASTICSEARCH_URIS:http://localhost:9200}
